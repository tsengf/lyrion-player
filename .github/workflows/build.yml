name: Build and test
on:
  workflow_dispatch:
  push:
  pull_request:

permissions:
  contents: read
jobs:
  macos:
    strategy:
      matrix:
        include:
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: x86_64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          cache: true
      - run: brew install flac libvorbis mpg123 libsoxr
      - run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_OSX_DEPLOYMENT_TARGET=13.0
      - run: cmake --build build --parallel
      - run: ctest --test-dir build --output-on-failure
      - name: Create installation package
        run: cmake --build build --config Release --target package
      - name: Verify disk image and bundled application
        shell: bash
        run: |
          images=(build/*.dmg)
          test "${#images[@]}" -eq 1
          hdiutil verify "${images[0]}"
          mkdir -p build/package-mount
          hdiutil attach -readonly -nobrowse -mountpoint build/package-mount "${images[0]}"
          trap 'hdiutil detach build/package-mount' EXIT
          test -L build/package-mount/Applications
          test -f "build/package-mount/Lyrion Player.app/Contents/Resources/licenses/COPYING"
          test -f "build/package-mount/Lyrion Player.app/Contents/Frameworks/QtWidgets.framework/QtWidgets"
          test -f "build/package-mount/Lyrion Player.app/Contents/PlugIns/platforms/libqcocoa.dylib"
          test ! -d build/package-mount/bin
          codesign --verify --deep --strict "build/package-mount/Lyrion Player.app"
          "build/package-mount/Lyrion Player.app/Contents/MacOS/Lyrion Player" --smoke-test
          "build/package-mount/Lyrion Player.app/Contents/MacOS/player" --help
      - uses: actions/upload-artifact@v4
        with:
          name: lyrion-player-macos-${{ matrix.arch }}
          path: build/*.dmg
          if-no-files-found: error
          retention-days: 30
  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          arch: win64_msvc2022_64
          cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - shell: pwsh
        run: cmake -S . -B build -A x64 "-DCMAKE_TOOLCHAIN_FILE=$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake"
      - run: cmake --build build --config Release --parallel
      - name: Deploy Qt for development tests
        shell: pwsh
        run: |
          windeployqt --release --no-translations "build/Release/Lyrion Player.exe" "build/Release/player_qt_ui_test.exe"
          if ($LASTEXITCODE -ne 0) { throw 'Qt test deployment failed' }
      - run: ctest --test-dir build -C Release --output-on-failure
      - name: Locate NSIS
        shell: pwsh
        run: |
          $nsis = "${env:ProgramFiles(x86)}\NSIS"
          if (!(Test-Path "$nsis/makensis.exe")) {
            choco install nsis --yes --no-progress
            if ($LASTEXITCODE -ne 0) { throw 'NSIS installation failed' }
          }
          $nsis | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: Create installation package
        run: cmake --build build --config Release --target PACKAGE
      - name: Install and smoke test Windows package
        shell: pwsh
        run: |
          $installers = @(Get-ChildItem build/LyrionPlayer-*.exe)
          if ($installers.Count -ne 1) { throw 'Expected one installer' }
          $destination = Join-Path $env:RUNNER_TEMP 'LyrionPlayer-install'
          $install = Start-Process $installers[0].FullName -ArgumentList '/S', "/D=$destination" -Wait -PassThru
          if ($install.ExitCode -ne 0) { throw "Installer failed: $($install.ExitCode)" }
          foreach ($file in 'Lyrion Player.exe', 'player.exe', 'msvcp140.dll', 'vcruntime140.dll', 'licenses/COPYING', 'Qt6Core.dll', 'Qt6Gui.dll', 'Qt6Widgets.dll', 'Qt6Network.dll', 'plugins/platforms/qwindows.dll') {
            if (!(Test-Path (Join-Path $destination $file))) { throw "Installed file missing: $file" }
          }
          $process = Start-Process -FilePath (Join-Path $destination 'Lyrion Player.exe') -ArgumentList '--smoke-test' -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw 'Installed tray smoke test failed' }
          $backend = Start-Process -FilePath (Join-Path $destination 'player.exe') -ArgumentList '--help' -Wait -PassThru
          if ($backend.ExitCode -ne 0) { throw 'Installed backend smoke test failed' }
          $shortcuts = Join-Path ([Environment]::GetFolderPath('CommonPrograms')) 'Lyrion Player'
          if (!(Test-Path (Join-Path $shortcuts 'Lyrion Player.lnk'))) { throw 'Start menu shortcut missing' }
          $uninstaller = Join-Path $destination 'Uninstall.exe'
          if (!(Test-Path $uninstaller)) { throw 'Uninstaller missing' }
          $uninstall = Start-Process $uninstaller -ArgumentList '/S', "_?=$destination" -Wait -PassThru
          if ($uninstall.ExitCode -ne 0) { throw 'Uninstaller failed' }
          if (Test-Path (Join-Path $destination 'Lyrion Player.exe')) { throw 'Uninstall left the app installed' }
      - uses: actions/upload-artifact@v4
        with:
          name: lyrion-player-windows-x64
          path: build/LyrionPlayer-*.exe
          if-no-files-found: error
          retention-days: 30
